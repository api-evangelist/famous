api_pricing_note: >-
  Spring publishes NO pricing for the Spring Seller API itself. Access is gated on an `app_id`
  issued by Spring on request (see authentication/famous-authentication.yml), with no published
  price, quota, or tier attached. The three plans below are the Amaze Commerce PLATFORM
  subscription — what a creator pays to use the product the API reads from — not an API plan. No
  page on api.teespring.com, spri.ng, amazecommerce.com or amaze.co attaches a price to API access.
