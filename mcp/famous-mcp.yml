blockers_for_a_real_server:
- No self-serve credential issuance. The app_id must be requested from Spring by a human ("Obtain
  an app_id from Teespring"), so an MCP client has no anonymous path to a token.
- The token exchange requires the account EMAIL AND PASSWORD, so an MCP server would have to hold a
  seller's primary login credential rather than a revocable, scoped API key.
- Tokens expire every 24 hours with no refresh token, so a long-lived server must re-submit the
  password on a daily cycle.
- No scopes. A token is all-or-nothing over the seller's account, including payouts and buyer PII.
- No idempotency key on the one write operation that has real-world consequences (buyer email).
- No response schemas anywhere in the spec, so tool OUTPUT shapes cannot be declared without an
  authenticated capture.
