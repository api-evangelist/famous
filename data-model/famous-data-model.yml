id_conventions:
  slug:
    used_by: [CampaignRoot, Campaign, Category]
    note: >-
      Type-inconsistent across the surface. `slug` is a STRING query parameter on GET
      /seller/v1/campaigns ("Unique identifier in the campaign's url") but is declared
      `type: integer, format: int32` as the path parameter on GET /v1/campaigns/{slug}. A generated
      client will produce two incompatible signatures for the same concept.
  lookup_number:
    used_by: [Order]
  recommender_id:
    used_by: [Recommender]
  prefixed_ids: none published
gaps:
- No object reference page exists, so field names, types, nullability and id formats are unknown
  without an authenticated call. `definitions` is empty and no operation declares a response schema.
- The gRPC services Amaze publishes to npm (see grpc/) describe a DIFFERENT, newer data core —
  user identity, onboarding task lists, subscriptions, custom domains — that has no overlap with
  the Seller API entities above. The two surfaces are not projections of the same model.
