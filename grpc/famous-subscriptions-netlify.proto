syntax = "proto3";

package subscriptionscoordinator.v1.netlify.v1;

service NetlifyService {
  rpc NetlifyUpsertSite(NetlifyUpsertSiteRequest) returns (NetlifyUpsertSiteResponse) {}
  rpc NetlifyDeleteSite(NetlifyDeleteSiteRequest) returns (NetlifyDeleteSiteResponse) {}
  rpc NetlifyRenewSiteSSLCertificate(NetlifyRenewSiteSSLCertificateRequest) returns (NetlifyRenewSiteSSLCertificateResponse) {}
  rpc NetlifySiteBuildStatus(NetlifySiteBuildStatusRequest) returns (NetlifySiteBuildStatusResponse) {}
}

message NetlifyUpsertSiteRequest {
  string site_name = 1;
  string custom_domain = 2;
  string store_id = 3;
  bool is_subdomain = 4;
}

message NetlifyDeleteSiteRequest {
  string site_id = 1;
}

message NetlifyRenewSiteSSLCertificateRequest {
  string site_id = 1;
}

message NetlifyUpsertSiteResponse {
  bool success = 1;
  string response = 2;
}

message NetlifyDeleteSiteResponse {
  bool success = 1;
  string response = 2;
}

message NetlifyRenewSiteSSLCertificateResponse {
  bool success = 1;
  string response = 2;
}

message NetlifySiteBuildStatusRequest {
  string site_id = 1;
}

message NetlifySiteBuildStatusResponse {
  bool success = 1;
  SiteBuildStatusResponse response = 2;
}

message SiteBuildStatusResponse {
  string id = 1;
  string deploy_id = 2;
  string sha = 3;
  bool done = 4;
  string error = 5;
  string created_at = 6;
  string deploy_state = 7;
}
