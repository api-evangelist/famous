apis:
- name: Spring Seller API
  description: >-
    The Spring (formerly Teespring) Seller API — a Swagger 2.0 contract with 24
    operations across three surfaces: `seller/v1/*` (the authenticated seller's
    dashboard, campaigns, orders, payouts, promotions, volume discounts, and
    buyer messaging), `v1/*` (public storefront reads — campaigns, categories,
    recommenders, rush prices, trending search suggestions — plus the
    authenticated user profile and saved addresses/cards), and `internal/v1/*`
    (inbound Stripe dispute webhook receivers). Authentication is a
    seller-scoped `access_token` minted by POST /v1/auth-tokens from an email,
    password, and an `app_id` that Spring issues on request; the token expires
    after 24 hours. Public storefront reads take an `app_id` query parameter
    instead. The API is served on api.teespring.com, Spring's legacy API host,
    and is operated by Amaze Holdings, Inc.
  humanURL: https://api.teespring.com/docs
  baseURL: https://api.teespring.com/
