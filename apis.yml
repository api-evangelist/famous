description: >-
  Famous (famous.co) now redirects to Amaze (amaze.co), the creator-commerce
  platform operated by Amaze Holdings, Inc. Amaze describes itself as building
  the operating system for creator-led businesses, bringing commerce, content,
  media, and live shopping into one connected ecosystem. Its products include
  Amaze Commerce (creator storefronts and AI-powered product creation), Amaze
  Live (shoppable livestreams), and Amaze Media (performance marketing and
  audience targeting for brands). The company reports 190K+ creators, 1.7B+
  lifetime fan reach, and operations across 183 countries. Surfaced originally
  as a portfolio company of Insight Partners and added to the API Evangelist
  network as a stub; no public developer API, SDK, or documentation surface was
  found during enrichment (identity and domain-security artifacts only).
