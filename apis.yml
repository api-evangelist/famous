name: Famous
description: >-
  Famous (famous.co) returns a 301 to Amaze (amaze.co), the creator-commerce
  platform operated by Amaze Holdings, Inc. Amaze describes itself as building
  the operating system for creator-led businesses, bringing commerce, content,
  media, and live shopping into one connected ecosystem. Its products include
  Amaze Commerce (creator storefronts and AI-powered product creation, at
  amazecommerce.com), Spring (spri.ng, the creator storefront brand formerly
  known as Teespring), Amaze Live (shoppable livestreams), and Amaze Media
  (performance marketing and audience targeting for brands). The company reports
  190K+ creators, 1.7B+ lifetime fan reach, and operations across 183 countries.
  Surfaced originally as a portfolio company of Insight Partners. A public,
  machine-readable API surface WAS found on the second enrichment pass: the
  Spring Seller API, a Swagger 2.0 contract with 24 operations served live at
  api.teespring.com (Spring's legacy API host), documented behind a Swagger UI at
  https://api.teespring.com/docs. Amaze also publishes first-party Protobuf/gRPC
  service contracts to npm under the @teespring scope.
