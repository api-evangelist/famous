client_sdk_summary:
  first_party_client_sdk_for_the_public_api: none
  note: >-
    Amaze/Spring publishes NO client library for the Spring Seller API in any language — npm, PyPI,
    RubyGems, Packagist, crates.io, NuGet, Maven Central and pkg.go.dev were all checked and the
    docs page at https://api.teespring.com/docs links no SDK. Because of that, NO `type: SDKs`
    pointer is wired in apis.yml; wiring one would credit Amaze with client libraries it does not
    ship. The four packages below ARE first-party (published by npm accounts ending -amaze /
    -amazeco, from repos in github.com/teespring), but three are internal gRPC service contracts
    and one is an internal React design system — none of them wraps the public REST API.
