  - 'app_id is missing'
  remediation: >-
    Supply every parameter the operation declares `required: true` in
    openapi/famous-spring-api-swagger.json. Seller operations need `access_token`; public
    storefront reads need `app_id`; /seller/v1/summary additionally needs `period`.
  observed: true
  method: probed
- status: 404
