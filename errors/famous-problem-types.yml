rfc9457_note: >-
  The API does NOT emit application/problem+json. Errors come back as application/json with a
  single top-level `error` key. No `type`, `title`, `status`, `detail` or `instance` member is
  present, and no problem-type URIs are published.
spec_coverage:
  note: >-
    The published Swagger 2.0 document declares ONLY success responses — 200 on every GET, 201 on
    POST /v1/auth-tokens and the two internal Stripe webhook receivers. Not one 4xx or 5xx response
    is documented across all 24 operations, so this catalog could not be derived from the spec's
    response objects. Everything below was OBSERVED on live unauthenticated calls; the envelopes
    are real, the coverage is partial by construction.
  documented_error_responses: 0
  documented_success_responses: 24
envelopes:
- shape: '{"error": "<string>"}'
  example: '{"error":"access_token is missing, period is missing"}'
  observed_on:
    url: https://api.teespring.com/seller/v1/summary
