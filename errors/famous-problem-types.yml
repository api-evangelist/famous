  title: Parameter value outside the accepted set
  detail_examples:
  - 'Unsupported period. Valid periods include: today, yesterday, week, month, seven_days, thirty_days'
  remediation: >-
    Use one of the enumerated values. Note the status code — the API answers an INVALID ENUM VALUE
