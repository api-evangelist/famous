gaps:
- No error reference page exists. api.teespring.com/docs documents authentication steps only; the
  Spring knowledge base (kb.spri.ng) has no developer section at all.
- No machine-readable error codes. Every error is a free-text English `message`; there is no stable
  symbolic code a client can branch on without string matching.
- Authentication failure is not distinguishable from validation failure by status alone — a missing
  token, a missing app_id and a bad enum all return 4xx with the same envelope family.
